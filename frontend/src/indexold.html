<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="initial-scale=1.0, user-scalable=no" />
  <title>Zoo Tiles</title>

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    #map {
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Your image bounding box (lat, lon)
    const bounds = [
      [18.976297122604752, 72.833687978356],    // bottom-left (lat, lon)
      [18.98045336411004, 72.8410791132924]     // top-right (lat, lon)
    ];

    // Create map
    const map = L.map("map", {
      center: [18.9783, 72.8378],   // roughly center of your image
      zoom: 2,
      minZoom: 0,
      maxZoom: 4,
    });

    // Add tiles generated by gdal2tiles (local)
    L.tileLayer("tiles/{z}/{x}/{y}.png", {
      tileSize: 256,
      maxZoom: 4,
      minZoom: 0,
      noWrap: true,
      bounds: bounds
    }).addTo(map);

    // Fit map to your georeferenced image boundaries
    map.fitBounds(bounds);
  </script>
</body>
</html>
